<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | s.qch.jp</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-sub: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: rgba(37, 99, 235, 0.1);
            --shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1120;
                --surface: #111827;
                --border: #1e293b;
                --text: #f8fafc;
                --text-sub: #94a3b8;
                --accent: #3b82f6;
                --accent-hover: #2563eb;
                --accent-soft: rgba(59, 130, 246, 0.15);
                --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
            display: grid;
            place-items: center;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 40px 28px 32px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .code {
            display: inline-block;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 13.5px;
            color: var(--text-sub);
            line-height: 1.7;
            margin-bottom: 18px;
        }

        .path-box {
            display: inline-block;
            max-width: 100%;
            padding: 6px 12px;
            margin-bottom: 24px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12.5px;
            color: var(--text);
            word-break: break-all;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 12px;
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        footer {
            margin-top: 28px;
            font-size: 11.5px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">404</div>
        <h1>ショートカットが見つかりません</h1>
        <p class="desc">
            指定された短縮URLは登録されていないか、削除された可能性があります。<br>
            URLのスペルをご確認ください。
        </p>
        <div id="requestedPath" class="path-box">s.qch.jp</div>
        <div>
            <a href="/" class="btn">s.qch.jp トップへ戻る</a>
        </div>
        <footer>© <!-- BUILD_YEAR --> s.qch.jp · Managed by MotoYucchi</footer>
    </main>

    <script>
        const pathEl = document.getElementById('requestedPath');
        if (pathEl) {
            pathEl.textContent = `s.qch.jp${window.location.pathname}`;
        }
    </script>
</body>
</html>
