<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - s.qch.jp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f3efe4;
            background-image:
                linear-gradient(to right, rgba(168, 159, 140, 0.14) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 159, 140, 0.14) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #2c2822;
            font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "MS PGothic", sans-serif;
            font-size: 14px;
            line-height: 1.7;
            min-height: 100vh;
            padding: 24px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .frame {
            width: 100%;
            max-width: 500px;
            background-color: #fdfbf6;
            border: 3px double #9e9582;
            box-shadow: 4px 4px 0 #d8d0be;
        }

        .titlebar {
            background-color: #6b5649;
            color: #fbfaf5;
            padding: 10px 16px;
            border-bottom: 2px solid #4c3c33;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .body {
            padding: 24px 22px 20px;
            text-align: center;
        }

        .code {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 36px;
            font-weight: bold;
            color: #6b5649;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 17px;
            margin-bottom: 10px;
            color: #2c2822;
        }

        .desc {
            font-size: 13.5px;
            color: #554e42;
            margin-bottom: 16px;
        }

        .path-box {
            display: inline-block;
            max-width: 100%;
            padding: 6px 12px;
            margin-bottom: 20px;
            background-color: #f6f2e8;
            border: 1px dashed #bfb59e;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 13px;
            color: #3b352b;
            word-break: break-all;
        }

        .retro-btn {
            display: inline-block;
            padding: 6px 18px;
            background-color: #eae4d4;
            color: #1c4c7c;
            border: 2px solid;
            border-color: #ffffff #9c927d #9c927d #ffffff;
            text-decoration: underline;
            font-size: 13.5px;
            font-weight: bold;
        }

        .retro-btn:hover {
            background-color: #e1d9c5;
        }

        .retro-btn:active {
            border-color: #9c927d #ffffff #ffffff #9c927d;
        }

        hr.groove {
            border: none;
            border-top: 1px solid #c4baa4;
            border-bottom: 1px solid #ffffff;
            margin: 20px 0 10px;
        }

        footer {
            font-size: 12px;
            color: #635b4e;
        }
    </style>
</head>
<body>
    <main class="frame">
        <div class="titlebar">
            <span>404 Not Found</span>
            <span style="font-size:12px; font-weight:normal;">s.qch.jp</span>
        </div>
        <div class="body">
            <div class="code">404</div>
            <h1>お探しの短縮URLは見つかりませんでした</h1>
            <p class="desc">
                指定されたページは削除されたか、URLの入力に誤りがある可能性があります。<br>
                お手数ですが、トップページのリンク集からご確認ください。
            </p>
            <div id="requestedPath" class="path-box">s.qch.jp</div>
            <div>
                <a href="/" class="retro-btn">s.qch.jp トップページへ戻る</a>
            </div>
            <hr class="groove">
            <footer>Copyright (C) <!-- BUILD_YEAR --> s.qch.jp · Managed by MotoYucchi</footer>
        </div>
    </main>

    <script>
        const pathEl = document.getElementById('requestedPath');
        if (pathEl) {
            pathEl.textContent = `s.qch.jp${window.location.pathname}`;
        }
    </script>
</body>
</html>
