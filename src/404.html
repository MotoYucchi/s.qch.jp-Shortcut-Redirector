<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Link Not Found | PicoLink</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- 基本設定 & パステルカラーパレット（メインと共通） --- */
        :root {
            --bg-color: #f4f7f6;       /* ミントがかったソフトホワイト */
            --primary: #bac7a7;        /* セージグリーン */
            --accent: #e8cdad;         /* アプリコットベージュ */
            --text-main: #697c70;      /* 深みのあるくすみグリーン */
            --text-sub: #9caaa0;       /* 淡いくすみグリーン */
            --card-bg: #ffffff;        /* ピュアホワイト */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- メインコンテナ --- */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 48px 32px;
            box-shadow: 0 10px 30px rgba(186, 199, 167, 0.15);
            text-align: center;
        }

        /* --- 404 ビジュアルアート --- */
        .error-visual {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f0f4f1, #fcf6ef);
            border-radius: 50%;
            z-index: 1;
        }

        .error-code {
            font-size: 38px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 2;
            letter-spacing: -1px;
        }

        /* --- テキスト領域 --- */
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .description {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 32px;
            word-break: break-all;
        }

        .requested-url {
            display: inline-block;
            background-color: #fafbfc;
            border: 1px solid #eef2f0;
            padding: 6px 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            color: var(--text-main);
            margin-top: 8px;
        }

        /* --- 戻るボタン --- */
        .btn-home {
            display: inline-block;
            background-color: var(--primary);
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 14px 32px;
            border-radius: 14px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(186, 199, 167, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            background-color: #abb997;
            box-shadow: 0 6px 16px rgba(186, 199, 167, 0.4);
        }

        /* --- フッター --- */
        footer {
            margin-top: 40px;
            font-size: 11px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="error-visual">
        <div class="bg-circle"></div>
        <div class="error-code">404</div>
    </div>

    <h1>リンクが見つかりません</h1>
    
    <p class="description">
        お探しの短縮URLは、削除されたかURLが間違っている可能性があります。<br>
        本サービスでは一般ユーザーによる新規リンク作成は行えません。
    </p>

    <!-- 戻るアクション -->
    <a href="index.html" class="btn-home">公式ディレクトリへ戻る</a>

    <footer>
        <p>© 2026 PicoLink. All Rights Reserved.</p>
    </footer>
</div>

</body>
</html>
