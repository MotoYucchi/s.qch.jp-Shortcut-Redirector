<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>s.qch.jp - ショートカットリンク集</title>
    <meta name="description" content="s.qch.jp — MotoYucchi / qch.jp 公式ショートカットリダイレクタ">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f3efe4;
            background-image:
                linear-gradient(to right, rgba(168, 159, 140, 0.14) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 159, 140, 0.14) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #2c2822;
            font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "MS PGothic", sans-serif;
            font-size: 14px;
            line-height: 1.65;
            min-height: 100vh;
            padding: 28px 14px 44px;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
            background-color: #fdfbf6;
            border: 3px double #9e9582;
            box-shadow: 4px 4px 0 #d8d0be;
        }

        /* クラシックなタイトルバー */
        .titlebar {
            background-color: #465d73;
            color: #fbfaf5;
            padding: 12px 18px;
            border-bottom: 2px solid #2f4152;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .titlebar h1 {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.04em;
            font-family: "Georgia", "Times New Roman", "Hiragino Mincho ProN", serif;
        }

        .titlebar .subtitle {
            font-size: 12px;
            color: #dde6ee;
            margin-left: 8px;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            font-weight: normal;
        }

        .counter-box {
            font-family: "Consolas", "Courier New", monospace;
            font-size: 12px;
            background-color: #35495c;
            border: 1px inset #6f879e;
            padding: 2px 8px;
            color: #f4f1e6;
        }

        .content {
            padding: 18px 20px 22px;
        }

        /* 案内エリア */
        .notice {
            background-color: #f7f3e7;
            border: 1px dashed #bfb59e;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #4a4338;
        }

        .notice strong {
            color: #2c2822;
        }

        /* 検索バー（レトロ枠＋快適UX） */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            padding: 10px 12px;
            background-color: #f2ede0;
            border: 1px solid #cbc2ae;
        }

        .search-label {
            font-size: 13px;
            font-weight: bold;
            color: #3d372d;
            white-space: nowrap;
        }

        .search-input {
            flex: 1;
            min-width: 180px;
            padding: 5px 8px;
            font-size: 14px;
            color: #2c2822;
            background-color: #ffffff;
            border: 2px solid;
            border-color: #9e9582 #ffffff #ffffff #9e9582;
            font-family: inherit;
        }

        .search-input:focus {
            outline: 2px solid #465d73;
            outline-offset: 1px;
        }

        .search-meta {
            font-size: 12px;
            color: #635b4e;
            margin-left: auto;
        }

        /* 控えめな立体風レトロボタン */
        .retro-btn {
            display: inline-block;
            padding: 4px 10px;
            font-size: 12.5px;
            font-family: inherit;
            font-weight: bold;
            color: #2c2822;
            background-color: #eae4d4;
            border: 2px solid;
            border-color: #ffffff #9c927d #9c927d #ffffff;
            text-decoration: none;
            cursor: pointer;
            line-height: 1.4;
            white-space: nowrap;
        }

        .retro-btn:hover {
            background-color: #e1d9c5;
        }

        .retro-btn:active {
            border-color: #9c927d #ffffff #ffffff #9c927d;
            padding: 5px 9px 3px 11px;
        }

        .btn-go {
            color: #1c4c7c;
        }

        .copy-btn.copied {
            background-color: #dce8d6;
            color: #275126;
        }

        /* クラシックなディレクトリ表 */
        .directory {
            border: 1px solid #b8ae98;
            background-color: #fdfbf6;
        }

        .dir-head {
            display: grid;
            grid-template-columns: 118px 1fr 122px;
            gap: 10px;
            padding: 7px 12px;
            background-color: #e9e2d0;
            border-bottom: 2px solid #b8ae98;
            font-size: 12px;
            font-weight: bold;
            color: #3f382e;
        }

        .link-row {
            display: grid;
            grid-template-columns: 118px 1fr 122px;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px dotted #cbc2ae;
            background-color: #fdfbf6;
        }

        .link-row:nth-child(even) {
            background-color: #f8f5ec;
        }

        .link-row:last-of-type {
            border-bottom: none;
        }

        .link-row:hover {
            background-color: #f1ead8;
        }

        .link-row.hidden {
            display: none;
        }

        .col-slug {
            font-family: "Consolas", "Courier New", monospace;
            font-size: 13.5px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .slug-link {
            color: #1c4c7c;
            text-decoration: underline;
            background-color: #efe9d8;
            border: 1px solid #cfc6b2;
            padding: 2px 6px;
            display: inline-block;
        }

        .slug-link:visited {
            color: #553b6e;
        }

        .col-info {
            min-width: 0;
        }

        .title-link {
            color: #1c4c7c;
            font-size: 14.5px;
            font-weight: bold;
            text-decoration: underline;
        }

        .title-link:visited {
            color: #553b6e;
        }

        .title-link:hover,
        .slug-link:hover {
            color: #8c3a2b;
        }

        .desc-line {
            margin-top: 2px;
            font-size: 12px;
            color: #5c5447;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: baseline;
        }

        .short-url {
            font-family: "Consolas", "Courier New", monospace;
            color: #4c453a;
        }

        .sep {
            color: #8f8572;
        }

        .dest-host {
            word-break: break-all;
        }

        .col-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }

        .empty-state {
            padding: 24px 16px;
            text-align: center;
            color: #5c5447;
            font-size: 13px;
        }

        hr.groove {
            border: none;
            border-top: 1px solid #c4baa4;
            border-bottom: 1px solid #ffffff;
            margin: 18px 0 12px;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: #635b4e;
        }

        .status-toast {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fdfbf6;
            color: #2c2822;
            border: 2px solid #465d73;
            box-shadow: 3px 3px 0 rgba(44, 40, 34, 0.2);
            padding: 7px 14px;
            font-size: 13px;
            font-weight: bold;
            display: none;
            z-index: 50;
        }

        .status-toast.show {
            display: block;
        }

        @media (max-width: 600px) {
            .content {
                padding: 14px 12px 18px;
            }
            .dir-head {
                display: none;
            }
            .link-row {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 12px;
            }
            .col-actions {
                justify-content: flex-start;
                margin-top: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="titlebar">
            <h1>
                s.qch.jp
                <span class="subtitle">- Shortcut Redirector</span>
            </h1>
            <div class="counter-box">公開リンク: <!-- PUBLIC_COUNT -->件</div>
        </header>

        <div class="content">
            <div class="notice">
                <strong>ご案内：</strong>ここは <strong>s.qch.jp</strong> の公式短縮URLリンク集です。一覧から目的のリンクを選ぶか、<code>https://s.qch.jp/スラッグ</code> へ直接アクセスしてください。
            </div>

            <div class="search-bar">
                <label class="search-label" for="searchInput">絞り込み検索：</label>
                <input id="searchInput" class="search-input" type="search" placeholder="例: ck, clock, mucon ( / キーで入力)" autocomplete="off">
                <button type="button" id="clearSearch" class="retro-btn">クリア</button>
                <span id="searchMeta" class="search-meta">全 <!-- PUBLIC_COUNT -->件表示中</span>
            </div>

            <main class="directory" id="linkList">
                <div class="dir-head" aria-hidden="true">
                    <div>パス</div>
                    <div>名称 / リンク先</div>
                    <div style="text-align:right;">操作</div>
                </div>
<!-- PUBLIC_LINKS -->
                <div id="noMatch" class="empty-state" style="display: none;">一致するショートカットは見つかりませんでした。</div>
            </main>

            <hr class="groove">

            <footer>
                <span>Copyright (C) <!-- BUILD_YEAR --> s.qch.jp</span>
                <span>Managed by MotoYucchi</span>
            </footer>
        </div>
    </div>

    <div id="toast" class="status-toast" role="status" aria-live="polite"></div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearch');
        const searchMeta = document.getElementById('searchMeta');
        const rows = Array.from(document.querySelectorAll('.link-row'));
        const noMatch = document.getElementById('noMatch');
        const toast = document.getElementById('toast');
        let toastTimer = null;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function applyFilter() {
            const q = searchInput.value.trim().toLowerCase();
            let visible = 0;
            for (const row of rows) {
                const haystack = row.getAttribute('data-search') || '';
                const matched = !q || haystack.includes(q);
                row.classList.toggle('hidden', !matched);
                if (matched) visible += 1;
            }
            if (searchMeta) {
                searchMeta.textContent = q ? `${visible} / ${rows.length}件ヒット` : `全 ${rows.length}件表示中`;
            }
            if (noMatch) {
                noMatch.style.display = rows.length > 0 && visible === 0 ? 'block' : 'none';
            }
        }

        if (searchInput) {
            searchInput.addEventListener('input', applyFilter);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    applyFilter();
                }
            });
        }

        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                applyFilter();
                searchInput.focus();
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
        });

        document.addEventListener('click', async (event) => {
            const btn = event.target.closest('.copy-btn');
            if (!btn) return;
            const url = btn.getAttribute('data-url');
            if (!url) return;
            try {
                await navigator.clipboard.writeText(url);
                const prev = btn.textContent;
                btn.textContent = '済!';
                btn.classList.add('copied');
                showToast(`コピーしました: ${url}`);
                setTimeout(() => {
                    btn.textContent = prev;
                    btn.classList.remove('copied');
                }, 1400);
            } catch {
                showToast(url);
            }
        });
    </script>
</body>
</html>
