<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>s.qch.jp | Shortcut Redirector</title>
    <meta name="description" content="s.qch.jp — MotoYucchi / qch.jp 公式ショートカットリダイレクタ">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f8fafc;
            --bg-glow: radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.08), transparent 45%),
                       radial-gradient(circle at 85% 90%, rgba(14, 165, 233, 0.08), transparent 45%);
            --surface: #ffffff;
            --surface-hover: #f8fafc;
            --border: #e2e8f0;
            --border-hover: #93c5fd;
            --text: #0f172a;
            --text-sub: #64748b;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.1);
            --shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1120;
                --bg-glow: radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.14), transparent 45%),
                           radial-gradient(circle at 85% 90%, rgba(14, 165, 233, 0.1), transparent 45%);
                --surface: #111827;
                --surface-hover: #172033;
                --border: #1e293b;
                --border-hover: #3b82f6;
                --text: #f8fafc;
                --text-sub: #94a3b8;
                --accent: #60a5fa;
                --accent-soft: rgba(96, 165, 250, 0.14);
                --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
            background-color: var(--bg);
            background-image: var(--bg-glow);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 18px 48px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 620px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 36px 28px 28px;
            box-shadow: var(--shadow);
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: #ffffff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .count-pill {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 4px 11px;
            border-radius: 999px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .tagline {
            font-size: 13.5px;
            color: var(--text-sub);
        }

        .search-wrap {
            position: relative;
            margin-bottom: 18px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-card {
            display: flex;
            align-items: stretch;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            overflow: hidden;
            transition: border-color 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
        }

        .link-card:hover {
            border-color: var(--border-hover);
            background: var(--surface-hover);
            transform: translateY(-1px);
        }

        .link-card.hidden {
            display: none;
        }

        .link-main {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 12px 14px 14px;
            text-decoration: none;
            color: inherit;
        }

        .link-badge {
            flex-shrink: 0;
            min-width: 64px;
            text-align: center;
            padding: 5px 10px;
            border-radius: 9px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            color: var(--accent);
            background: var(--accent-soft);
        }

        .link-body {
            flex: 1;
            min-width: 0;
        }

        .link-title {
            font-size: 14.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
            overflow: hidden;
        }

        .link-short {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            flex-shrink: 0;
        }

        .link-dest {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-arrow {
            flex-shrink: 0;
            color: var(--text-sub);
            font-size: 15px;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .link-card:hover .link-arrow {
            transform: translateX(3px);
            color: var(--accent);
        }

        .copy-btn {
            flex-shrink: 0;
            width: 44px;
            border: none;
            border-left: 1px solid var(--border);
            background: transparent;
            color: var(--text-sub);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .copy-btn:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 28px 16px;
            font-size: 13.5px;
            color: var(--text-sub);
            border: 1px dashed var(--border);
            border-radius: 14px;
        }

        footer {
            margin-top: 26px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: #0f172a;
            color: #ffffff;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px 20px;
            }
            .link-sep,
            .link-dest {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand-row">
                <div class="brand">
                    <div class="brand-mark">s/</div>
                    <h1 class="brand-title">s.qch.jp</h1>
                </div>
                <span class="count-pill"><!-- PUBLIC_COUNT --> shortcuts</span>
            </div>
            <p class="tagline">qch.jp 公式ショートカットリダイレクタ。管理者が登録した短縮URLへ高速に転送します。</p>
        </header>

        <div class="search-wrap">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="searchInput" class="search-input" type="search" placeholder="ショートカットを検索（例: ck, clock, mucon）" autocomplete="off">
        </div>

        <main class="link-list" id="linkList">
<!-- PUBLIC_LINKS -->
            <div id="noMatch" class="empty-state" style="display: none;">該当するショートカットが見つかりませんでした。</div>
        </main>

        <footer>
            <span>© <!-- BUILD_YEAR --> s.qch.jp</span>
            <span>Managed by MotoYucchi</span>
        </footer>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const cards = Array.from(document.querySelectorAll('.link-card'));
        const noMatch = document.getElementById('noMatch');
        const toast = document.getElementById('toast');
        let toastTimer = null;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        if (searchInput) {
            searchInput.addEventListener('input', () => {
                const q = searchInput.value.trim().toLowerCase();
                let visible = 0;
                for (const card of cards) {
                    const haystack = card.getAttribute('data-search') || '';
                    const matched = !q || haystack.includes(q);
                    card.classList.toggle('hidden', !matched);
                    if (matched) visible += 1;
                }
                if (noMatch) {
                    noMatch.style.display = cards.length > 0 && visible === 0 ? 'block' : 'none';
                }
            });
        }

        document.addEventListener('click', async (event) => {
            const btn = event.target.closest('.copy-btn');
            if (!btn) return;
            const url = btn.getAttribute('data-url');
            if (!url) return;
            try {
                await navigator.clipboard.writeText(url);
                showToast(`コピーしました: ${url}`);
            } catch {
                showToast(url);
            }
        });
    </script>
</body>
</html>
