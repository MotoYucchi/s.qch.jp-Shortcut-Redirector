<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__SITE_DOMAIN__ 管理ツール (MotoYucchi Local Admin)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f2eee2;
            background-image:
                linear-gradient(to right, rgba(168, 159, 140, 0.13) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 159, 140, 0.13) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #2c2822;
            font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "MS PGothic", sans-serif;
            font-size: 13.5px;
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* クラシックな上部ウィンドウバー */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background-color: #465d73;
            color: #fbfaf5;
            border-bottom: 3px double #2b3c4d;
        }

        .topbar-inner {
            max-width: 1080px;
            margin: 0 auto;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .brand-title {
            font-size: 18px;
            font-weight: bold;
            font-family: "Georgia", "Times New Roman", serif;
            letter-spacing: 0.03em;
        }

        .admin-tag {
            font-size: 11.5px;
            padding: 1px 8px;
            background-color: #35495c;
            border: 1px solid #7f97ae;
            color: #eef3f7;
            font-family: "Consolas", "Courier New", monospace;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-pill {
            display: inline-block;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            font-family: "Consolas", "Courier New", monospace;
            border: 1px solid #9c927d;
            background-color: #f7f3e8;
            color: #3b352b;
        }

        .pill-ok { background-color: #e4efe0; border-color: #6b9167; color: #264d24; }
        .pill-warn { background-color: #f8eed7; border-color: #b89146; color: #6e4f12; }
        .pill-info { background-color: #e4edf5; border-color: #6787a6; color: #234668; }

        .top-link {
            color: #fbfaf5;
            font-size: 12.5px;
            text-decoration: underline;
            padding: 3px 8px;
            background-color: #384d61;
            border: 1px solid #758da3;
        }

        .top-link:hover {
            background-color: #2f4152;
        }

        .main {
            max-width: 1080px;
            margin: 18px auto 0;
            padding: 0 16px;
            display: grid;
            gap: 18px;
        }

        /* クラシックパネル枠 */
        .panel {
            background-color: #fdfbf6;
            border: 2px solid #9e9582;
            box-shadow: 3px 3px 0 #d8d0be;
        }

        .panel-header {
            background-color: #e9e2d0;
            border-bottom: 2px solid #b5ab94;
            padding: 9px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .panel-title {
            font-size: 14.5px;
            font-weight: bold;
            color: #2c2822;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .panel-body {
            padding: 14px 16px 16px;
        }

        /* クラシック立体風ボタン */
        button, .btn-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            color: #2c2822;
            background-color: #eae4d4;
            border: 2px solid;
            border-color: #ffffff #968c77 #968c77 #ffffff;
            cursor: pointer;
            text-decoration: none;
            line-height: 1.4;
        }

        button:hover:not(:disabled), .btn-link:hover {
            background-color: #e0d8c4;
        }

        button:active:not(:disabled) {
            border-color: #968c77 #ffffff #ffffff #968c77;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: #465d73;
            color: #ffffff;
            border-color: #7792ac #2a3b4b #2a3b4b #7792ac;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #3a4f63;
        }

        .btn-sync {
            background-color: #3d6b47;
            color: #ffffff;
            border-color: #6ea079 #24452b #24452b #6ea079;
        }

        .btn-sync:hover:not(:disabled) {
            background-color: #31593a;
        }

        .btn-danger {
            background-color: #f4e3e0;
            color: #8c2f24;
            border-color: #ffffff #b57c74 #b57c74 #ffffff;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: #ebd2ce;
        }

        .btn-sm {
            padding: 3px 9px;
            font-size: 12px;
        }

        /* 入力フィールド（クラシックな凹み枠） */
        .input {
            flex: 1;
            min-width: 200px;
            padding: 6px 9px;
            font-size: 13.5px;
            font-family: inherit;
            color: #2c2822;
            background-color: #ffffff;
            border: 2px solid;
            border-color: #9c927d #ffffff #ffffff #9c927d;
        }

        .input:focus {
            outline: 2px solid #465d73;
            outline-offset: 1px;
        }

        .git-controls {
            display: grid;
            gap: 10px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .checkbox-row {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: #4a4338;
            cursor: pointer;
        }

        /* クラシック見出しタブ */
        .tabs {
            display: flex;
            gap: 4px;
            margin-top: 14px;
            border-bottom: 2px solid #b5ab94;
        }

        .tab-btn {
            border: 1px solid #b5ab94;
            border-bottom: none;
            background-color: #ebe5d6;
            color: #554e42;
            padding: 5px 12px;
            font-size: 12.5px;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            background-color: #f6f2e7;
            color: #2c2822;
            border-top: 2px solid #465d73;
            border-bottom: 2px solid #f6f2e7;
        }

        .console {
            background-color: #f6f2e7;
            color: #2c2822;
            border: 1px solid #b5ab94;
            border-top: none;
            padding: 10px 12px;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 12px;
            max-height: 210px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .commit-list {
            background-color: #f6f2e7;
            border: 1px solid #b5ab94;
            border-top: none;
            padding: 8px;
            display: grid;
            gap: 6px;
            max-height: 210px;
            overflow: auto;
        }

        .commit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 8px;
            background-color: #fdfbf6;
            border: 1px dotted #bfb59e;
            font-size: 12.5px;
        }

        .commit-hash {
            font-family: "Consolas", "Courier New", monospace;
            color: #1c4c7c;
            font-weight: bold;
            margin-right: 6px;
        }

        .commit-meta {
            color: #635b4e;
            font-size: 11.5px;
            white-space: nowrap;
        }

        /* 検索＆フィルタバー */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding: 9px 10px;
            background-color: #f2ede0;
            border: 1px solid #cbc2ae;
        }

        .filter-group {
            display: flex;
            gap: 5px;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid #b8ae98;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background-color: #fdfbf6;
        }

        th, td {
            text-align: left;
            padding: 9px 10px;
            border-bottom: 1px dotted #cbc2ae;
            vertical-align: middle;
        }

        th {
            background-color: #ece6d7;
            border-bottom: 2px solid #b8ae98;
            font-size: 12px;
            color: #3f382e;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background-color: #f8f5ec;
        }

        tbody tr:hover {
            background-color: #f1ead8;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .slug-cell {
            font-family: "Consolas", "Courier New", monospace;
            font-weight: bold;
            color: #1c4c7c;
            white-space: nowrap;
        }

        .url-cell {
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .url-cell a {
            color: #1c4c7c;
            text-decoration: underline;
        }

        .url-cell a:visited {
            color: #553b6e;
        }

        .subtext {
            font-size: 11.5px;
            color: #635b4e;
        }

        .actions-cell {
            display: flex;
            align-items: center;
            gap: 5px;
            justify-content: flex-end;
            white-space: nowrap;
        }

        .toggle-pub {
            background-color: #e4efe0;
            color: #264d24;
            border-color: #ffffff #789a74 #789a74 #ffffff;
        }

        .toggle-priv {
            background-color: #ece7da;
            color: #5d5548;
        }

        /* クラシックダイアログ（モーダル） */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(44, 40, 34, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
        }

        .modal-backdrop.open { display: flex; }

        .modal {
            width: 100%;
            max-width: 500px;
            background-color: #fdfbf6;
            border: 3px double #7d7463;
            box-shadow: 5px 5px 0 rgba(44, 40, 34, 0.35);
        }

        .modal-header {
            background-color: #465d73;
            color: #ffffff;
            padding: 9px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #2b3c4d;
        }

        .modal-body {
            padding: 16px 18px;
            display: grid;
            gap: 12px;
        }

        .field {
            display: grid;
            gap: 4px;
        }

        .field label {
            font-size: 12.5px;
            font-weight: bold;
            color: #3b352b;
        }

        .preview-url {
            font-size: 12px;
            color: #1c4c7c;
            font-family: "Consolas", "Courier New", monospace;
            background-color: #f3efe4;
            border: 1px dashed #bfb59e;
            padding: 3px 7px;
        }

        .modal-footer {
            padding: 10px 18px;
            background-color: #efeae0;
            border-top: 1px solid #c4baa4;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            background-color: #fdfbf6;
            color: #2c2822;
            border: 2px solid #465d73;
            box-shadow: 3px 3px 0 rgba(44, 40, 34, 0.25);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            display: none;
            z-index: 100;
        }

        .toast.show { display: block; }
        .toast.error {
            background-color: #f9ebe8;
            border-color: #8c2f24;
            color: #8c2f24;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-title">__SITE_DOMAIN__ 管理ツール</span>
                <span class="admin-tag">MotoYucchi Local Admin</span>
            </div>
            <div class="topbar-actions">
                <span id="branchBadge" class="status-pill">branch: ...</span>
                <span id="syncBadge" class="status-pill">確認中...</span>
                <a class="top-link" href="https://__SITE_DOMAIN__" target="_blank" rel="noopener">s.qch.jp を開く ↗</a>
                <a id="actionsLink" class="top-link" href="https://github.com/MotoYucchi/s.qch.jp-Shortcut-Redirector/actions" target="_blank" rel="noopener">GitHub Actions ↗</a>
            </div>
        </div>
    </header>

    <main class="main">
        <!-- Git Sync & Deploy パネル -->
        <section class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span>■ Git 同期・デプロイ操作</span>
                    <span id="dirtyFilesBadge" class="status-pill pill-warn" style="display:none;"></span>
                </div>
                <div class="row">
                    <button type="button" id="btnRefresh" class="btn-sm">状態更新</button>
                    <button type="button" id="btnBuildTest" class="btn-sm">ビルドテスト</button>
                    <button type="button" id="btnDiscard" class="btn-sm btn-danger" style="display:none;">links.json 変更破棄</button>
                </div>
            </div>
            <div class="panel-body">
                <div class="git-controls">
                    <div class="row">
                        <input id="commitMessage" class="input" type="text" placeholder="コミットメッセージ（空欄時: Update shortcuts in links.json）">
                        <label class="checkbox-row">
                            <input type="checkbox" id="stageAllCheck">
                            全変更を対象にする (git add -A)
                        </label>
                    </div>
                    <div class="row">
                        <button type="button" id="btnSync" class="btn-sync">★ Sync &amp; Deploy（Commit → Pull → Push）</button>
                        <button type="button" id="btnPull">↓ Pull（取得）</button>
                        <button type="button" id="btnCommit">✓ Commit（記録）</button>
                        <button type="button" id="btnPush">↑ Push（送信）</button>
                    </div>
                </div>

                <div class="tabs">
                    <button type="button" class="tab-btn active" data-tab="log">実行ログ</button>
                    <button type="button" class="tab-btn" data-tab="diff">links.json 差分 (Diff)</button>
                    <button type="button" class="tab-btn" data-tab="commits">最近のコミット履歴</button>
                </div>

                <div id="tab-log">
                    <pre id="consoleOutput" class="console">準備完了。ショートカットを編集後、「Sync &amp; Deploy」を押すと GitHub Pages へ自動反映されます。</pre>
                </div>
                <div id="tab-diff" style="display:none;">
                    <pre id="diffOutput" class="console">未コミットの差分はありません。</pre>
                </div>
                <div id="tab-commits" style="display:none;">
                    <div id="commitList" class="commit-list"></div>
                </div>
            </div>
        </section>

        <!-- ショートカット一覧パネル -->
        <section class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span>■ ショートカット一覧</span>
                    <span id="countBadge" class="status-pill pill-info">0件</span>
                </div>
                <button type="button" id="btnOpenAdd" class="btn-primary">＋ 新規ショートカット追加</button>
            </div>
            <div class="panel-body">
                <div class="toolbar">
                    <input id="searchInput" class="input" type="search" placeholder="スラッグ・名称・URLで検索... ( / キーで入力)">
                    <div class="filter-group">
                        <button type="button" class="btn-sm filter-btn btn-primary" data-filter="all">すべて</button>
                        <button type="button" class="btn-sm filter-btn" data-filter="public">公開のみ</button>
                        <button type="button" class="btn-sm filter-btn" data-filter="private">非公開のみ</button>
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>パス</th>
                                <th>名称 / 説明</th>
                                <th>遷移先 URL</th>
                                <th>トップ掲載</th>
                                <th style="text-align:right;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="linksTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- 追加・編集モーダル -->
    <div id="linkModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle" style="font-size:14.5px;">ショートカットを追加</h2>
                <button type="button" id="btnCloseModal" class="btn-sm">✕</button>
            </div>
            <form id="linkForm">
                <div class="modal-body">
                    <input type="hidden" id="fieldOriginalSlug">
                    <div class="field">
                        <label for="fieldSlug">スラッグ（パス）※必須</label>
                        <input id="fieldSlug" class="input" type="text" required placeholder="例: ck">
                        <div id="slugPreview" class="preview-url">https://__SITE_DOMAIN__/</div>
                    </div>
                    <div class="field">
                        <label for="fieldUrl">遷移先 URL ※必須</label>
                        <input id="fieldUrl" class="input" type="url" required placeholder="https://clipkit.qch.jp">
                    </div>
                    <div class="field">
                        <label for="fieldTitle">名称（任意）</label>
                        <input id="fieldTitle" class="input" type="text" placeholder="例: ClipKit">
                    </div>
                    <div class="field">
                        <label for="fieldDesc">説明（任意）</label>
                        <input id="fieldDesc" class="input" type="text" placeholder="例: clipkit.qch.jp">
                    </div>
                    <label class="checkbox-row">
                        <input type="checkbox" id="fieldPublic" checked>
                        <span>トップページ (s.qch.jp) のリンク集に掲載する</span>
                    </label>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btnCancelModal">キャンセル</button>
                    <button type="submit" id="btnSaveLink" class="btn-primary">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const TOKEN = '__MANAGER_TOKEN__';
        const SITE_DOMAIN = '__SITE_DOMAIN__';

        let allLinks = [];
        let currentFilter = 'all';
        let modalMode = 'add';
        let toastTimer = null;

        const $ = (id) => document.getElementById(id);

        function showToast(message, isError = false) {
            const el = $('toast');
            el.textContent = message;
            el.classList.toggle('error', isError);
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
        }

        function appendLog(text) {
            const box = $('consoleOutput');
            const now = new Date().toLocaleTimeString('ja-JP');
            box.textContent = `[${now}] ${text}\n\n${box.textContent}`.slice(0, 12000);
        }

        async function api(path, method = 'GET', body = null) {
            const opts = {
                method,
                headers: {
                    'X-Manager-Token': TOKEN,
                },
            };
            if (body !== null) {
                opts.headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(body);
            }
            const res = await fetch(path, opts);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const err = new Error(data.error || `HTTP ${res.status}`);
                err.data = data;
                throw err;
            }
            return data;
        }

        function formatSteps(steps) {
            if (!Array.isArray(steps) || steps.length === 0) return '';
            return steps
                .map((s) => {
                    const out = [s.stdout, s.stderr].filter(Boolean).join('\n');
                    return `$ ${s.command}${out ? '\n' + out : '\n(ok)'}`;
                })
                .join('\n\n');
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeAttr(s) {
            return escapeHtml(s).replace(/'/g, '&#39;');
        }

        function renderLinks() {
            const query = $('searchInput').value.trim().toLowerCase();
            const filtered = allLinks.filter((item) => {
                if (currentFilter === 'public' && !item.public) return false;
                if (currentFilter === 'private' && item.public) return false;
                if (!query) return true;
                return `${item.slug} ${item.title} ${item.description} ${item.url}`
                    .toLowerCase()
                    .includes(query);
            });

            const publicCount = allLinks.filter((i) => i.public).length;
            $('countBadge').textContent = `全 ${allLinks.length} 件（公開 ${publicCount}）`;

            const tbody = $('linksTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:24px; color:#635b4e;">該当するショートカットがありません</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered
                .map((item) => {
                    const shortUrl = `https://${SITE_DOMAIN}/${item.slug}`;
                    const pubBtn = item.public
                        ? `<button type="button" class="btn-sm toggle-pub" data-action="toggle" data-slug="${escapeAttr(item.slug)}">公開中</button>`
                        : `<button type="button" class="btn-sm toggle-priv" data-action="toggle" data-slug="${escapeAttr(item.slug)}">非公開</button>`;

                    return `
                        <tr>
                            <td class="slug-cell">/${escapeHtml(item.slug)}</td>
                            <td>
                                <div style="font-weight:bold;">${escapeHtml(item.title)}</div>
                                ${item.description ? `<div class="subtext">${escapeHtml(item.description)}</div>` : ''}
                            </td>
                            <td class="url-cell">
                                <a href="${escapeAttr(item.url)}" target="_blank" rel="noopener" title="${escapeAttr(item.url)}">${escapeHtml(item.url)}</a>
                            </td>
                            <td>${pubBtn}</td>
                            <td>
                                <div class="actions-cell">
                                    <button type="button" class="btn-sm" data-action="copy" data-url="${escapeAttr(shortUrl)}">コピー</button>
                                    <button type="button" class="btn-sm" data-action="edit" data-slug="${escapeAttr(item.slug)}">編集</button>
                                    <button type="button" class="btn-sm btn-danger" data-action="delete" data-slug="${escapeAttr(item.slug)}">削除</button>
                                </div>
                            </td>
                        </tr>
                    `;
                })
                .join('');
        }

        function renderGitStatus(status) {
            $('branchBadge').textContent = `branch: ${status.branch}`;
            if (status.actionsUrl) {
                $('actionsLink').href = status.actionsUrl;
            }

            const syncBadge = $('syncBadge');
            syncBadge.className = 'status-pill';
            if (status.dirty) {
                syncBadge.classList.add('pill-warn');
                syncBadge.textContent = `未コミット変更あり (${status.files.length})`;
            } else if (status.ahead > 0 || status.behind > 0) {
                syncBadge.classList.add('pill-info');
                syncBadge.textContent = `ahead ${status.ahead} / behind ${status.behind}`;
            } else {
                syncBadge.classList.add('pill-ok');
                syncBadge.textContent = '同期済み (Synced)';
            }

            const dirtyBadge = $('dirtyFilesBadge');
            if (status.files.length > 0) {
                dirtyBadge.style.display = 'inline-block';
                dirtyBadge.textContent = status.files.map((f) => `${f.status} ${f.file}`).join(', ');
            } else {
                dirtyBadge.style.display = 'none';
            }

            $('btnDiscard').style.display = status.linksDirty ? 'inline-flex' : 'none';
            $('diffOutput').textContent = status.diff || '未コミットの差分はありません。';

            $('commitList').innerHTML = (status.commits || [])
                .map(
                    (c) => `
                    <div class="commit-item">
                        <div>
                            <span class="commit-hash">${escapeHtml(c.hash)}</span>
                            <span>${escapeHtml(c.subject)}</span>
                        </div>
                        <span class="commit-meta">${escapeHtml(c.relativeDate)} · ${escapeHtml(c.author)}</span>
                    </div>
                `
                )
                .join('');
        }

        async function loadAll() {
            const [linksData, gitStatus] = await Promise.all([
                api('/api/links'),
                api('/api/git/status'),
            ]);
            allLinks = linksData.links || [];
            renderLinks();
            renderGitStatus(gitStatus);
        }

        function openModal(mode, item = null) {
            modalMode = mode;
            $('modalTitle').textContent = mode === 'add' ? 'ショートカットを追加' : `ショートカットを編集 (/${item.slug})`;
            $('fieldOriginalSlug').value = item ? item.slug : '';
            $('fieldSlug').value = item ? item.slug : '';
            $('fieldUrl').value = item ? item.url : 'https://';
            $('fieldTitle').value = item ? item.title : '';
            $('fieldDesc').value = item ? item.description : '';
            $('fieldPublic').checked = item ? Boolean(item.public) : true;
            updateSlugPreview();
            $('linkModal').classList.add('open');
            $('fieldSlug').focus();
        }

        function closeModal() {
            $('linkModal').classList.remove('open');
        }

        function updateSlugPreview() {
            const slug = $('fieldSlug').value.trim();
            $('slugPreview').textContent = `https://${SITE_DOMAIN}/${slug}`;
        }

        async function runGitAction(buttonId, label, endpoint, payload = {}) {
            const btn = $(buttonId);
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = `${label} 実行中...`;
            try {
                const res = await api(endpoint, 'POST', payload);
                if (res.status) renderGitStatus(res.status);
                if (res.links) {
                    allLinks = res.links;
                    renderLinks();
                }
                const logText = formatSteps(res.steps) || res.message || `${label} 完了`;
                appendLog(logText);
                showToast(`${label} が完了しました`);
            } catch (err) {
                const stepsText = err.data && err.data.steps ? formatSteps(err.data.steps) : err.message;
                if (err.data && err.data.status) renderGitStatus(err.data.status);
                appendLog(`ERROR (${label}):\n${stepsText}`);
                showToast(`${label} に失敗しました: ${err.message}`, true);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        $('btnOpenAdd').addEventListener('click', () => openModal('add'));
        $('btnCloseModal').addEventListener('click', closeModal);
        $('btnCancelModal').addEventListener('click', closeModal);
        $('fieldSlug').addEventListener('input', updateSlugPreview);
        $('searchInput').addEventListener('input', renderLinks);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && $('linkModal').classList.contains('open')) {
                closeModal();
            } else if (
                e.key === '/' &&
                !$('linkModal').classList.contains('open') &&
                document.activeElement.tagName !== 'INPUT'
            ) {
                e.preventDefault();
                $('searchInput').focus();
            }
        });

        document.querySelectorAll('.filter-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                currentFilter = btn.dataset.filter;
                document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('btn-primary'));
                btn.classList.add('btn-primary');
                renderLinks();
            });
        });

        document.querySelectorAll('.tab-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
                btn.classList.add('active');
                ['log', 'diff', 'commits'].forEach((t) => {
                    $(`tab-${t}`).style.display = t === target ? 'block' : 'none';
                });
            });
        });

        $('linkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                originalSlug: $('fieldOriginalSlug').value.trim(),
                slug: $('fieldSlug').value.trim(),
                url: $('fieldUrl').value.trim(),
                title: $('fieldTitle').value.trim(),
                description: $('fieldDesc').value.trim(),
                public: $('fieldPublic').checked,
            };

            try {
                const method = modalMode === 'add' ? 'POST' : 'PUT';
                const res = await api('/api/links', method, payload);
                allLinks = res.links;
                renderLinks();
                closeModal();
                const actionWord = modalMode === 'add' ? 'Add' : 'Update';
                if (!$('commitMessage').value.trim()) {
                    $('commitMessage').value = `${actionWord} shortcut /${payload.slug}`;
                }
                showToast(`/${payload.slug} を保存しました`);
                appendLog(`links.json を更新: /${payload.slug} -> ${payload.url}`);
                renderGitStatus(await api('/api/git/status'));
            } catch (err) {
                showToast(err.message, true);
            }
        });

        $('linksTableBody').addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const action = btn.dataset.action;
            const slug = btn.dataset.slug;

            if (action === 'copy') {
                const url = btn.dataset.url;
                await navigator.clipboard.writeText(url).catch(() => {});
                showToast(`コピーしました: ${url}`);
                return;
            }

            const item = allLinks.find((l) => l.slug === slug);
            if (!item) return;

            if (action === 'edit') {
                openModal('edit', item);
                return;
            }

            if (action === 'toggle') {
                try {
                    const res = await api('/api/links', 'PUT', {
                        originalSlug: item.slug,
                        slug: item.slug,
                        url: item.url,
                        title: item.title,
                        description: item.description,
                        public: !item.public,
                    });
                    allLinks = res.links;
                    renderLinks();
                    showToast(`/${item.slug} を${!item.public ? '公開' : '非公開'}に変更しました`);
                    renderGitStatus(await api('/api/git/status'));
                } catch (err) {
                    showToast(err.message, true);
                }
                return;
            }

            if (action === 'delete') {
                if (!confirm(`ショートカット "/${slug}" (${item.url}) を削除しますか？`)) return;
                try {
                    const res = await api(`/api/links?slug=${encodeURIComponent(slug)}`, 'DELETE');
                    allLinks = res.links;
                    renderLinks();
                    if (!$('commitMessage').value.trim()) {
                        $('commitMessage').value = `Remove shortcut /${slug}`;
                    }
                    showToast(`/${slug} を削除しました`);
                    appendLog(`links.json から削除: /${slug}`);
                    renderGitStatus(await api('/api/git/status'));
                } catch (err) {
                    showToast(err.message, true);
                }
            }
        });

        $('btnRefresh').addEventListener('click', async () => {
            try {
                await loadAll();
                showToast('最新状態を取得しました');
            } catch (err) {
                showToast(err.message, true);
            }
        });

        $('btnBuildTest').addEventListener('click', async () => {
            try {
                const res = await api('/api/build', 'POST');
                const r = res.result;
                appendLog(`Build Test OK: ${r.generatedCount}/${r.total} links generated (skipped: ${r.skippedCount})`);
                showToast(`ビルド成功 (${r.generatedCount}件生成)`);
            } catch (err) {
                appendLog(`Build Test ERROR: ${err.message}`);
                showToast(`ビルド失敗: ${err.message}`, true);
            }
        });

        $('btnPull').addEventListener('click', async () => {
            await runGitAction('btnPull', 'Pull', '/api/git/pull');
            await loadAll();
        });

        $('btnCommit').addEventListener('click', () => {
            runGitAction('btnCommit', 'Commit', '/api/git/commit', {
                message: $('commitMessage').value.trim(),
                stageAll: $('stageAllCheck').checked,
            });
        });

        $('btnPush').addEventListener('click', () => {
            runGitAction('btnPush', 'Push', '/api/git/push');
        });

        $('btnSync').addEventListener('click', async () => {
            await runGitAction('btnSync', 'Sync & Deploy', '/api/git/sync', {
                message: $('commitMessage').value.trim(),
                stageAll: $('stageAllCheck').checked,
            });
            $('commitMessage').value = '';
            await loadAll();
        });

        $('btnDiscard').addEventListener('click', async () => {
            if (!confirm('links.json の未コミット変更をすべて破棄して元に戻しますか？')) return;
            await runGitAction('btnDiscard', '変更破棄', '/api/git/discard');
        });

        loadAll().catch((err) => {
            appendLog(`初期読み込みエラー: ${err.message}`);
            showToast('読み込みに失敗しました', true);
        });
    </script>
</body>
</html>
